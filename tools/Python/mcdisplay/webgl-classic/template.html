<!DOCTYPE html>
<html>
<head>
	<meta charset=utf-8>
	<style>
		body { margin: 0; }
		canvas { width: 100%; height: 100% }
		#lblTour { margin-left: 12px; }
		#lblTour input { margin: 0 4px; }
		#lblTour > * { margin-right: 12px; white-space: nowrap; }
		#btnTourPause { position: fixed; right: 16px; bottom: 16px; width: 48px; height: 48px; padding: 0; line-height: 0; display: none; }
	</style>
</head>
<body>
	<script src="three.min.js"></script>
	<script src="OrbitControls.js"></script>
	<script src="Lut.js"></script>
	<script src="_mcdisplay.js"></script>
	<script src="_instr.js"></script>
	<script src="_particles.js"></script>

	<script>
        var campos_x = -26.3, campos_y = 26.3, campos_z = 26.3;
        var box_x1 = 0, box_x2 = 3, box_y1 = -0.3, box_y2 = 0.3, box_z1 = 49, box_z2 = 53;
        var invert_canvas = false;
        // INSERT_CAMPOS_HERE
        // INSERT_BOX_HERE
        // INSERT_INVERT_CANVAS_HERE
        var box_lst = [box_x1, box_x2, box_y1, box_y2, box_z1, box_z2];
        var controller = new Controller(campos_x, campos_y, campos_z, box_lst, invert_canvas);
        var viewmodel = controller.viewmodel;

		// UI event handlers interacting only(!!) with the viewmodel.
		// TODO: implement callbacks
		var handlePlayPause = function()
		{
			if (viewmodel.playBack == PlayBack.RUN)
			{
				viewmodel.setPlayBack(PlayBack.PAUSE);
			}
			else
			{
				viewmodel.setPlayBack(PlayBack.RUN);
			}
		}
		var handleNext = function()
		{
			viewmodel.setPlayBack(PlayBack.PAUSE);
			viewmodel.setRayIdx(viewmodel.getRayIdx() + 1);
		}
		var handlePrev = function()
		{
			viewmodel.setPlayBack(PlayBack.PAUSE);
			viewmodel.setRayIdx(viewmodel.getRayIdx() - 1);
		}
		var handleKeepChanged = function(checked)
		{
			if (checked)
			{
				viewmodel.setDisplayMode(DisplayMode.KEEP);
			}
			else
			{
				viewmodel.setDisplayMode(DisplayMode.SINGLE);
			}
		}
		var handleShowBBChanged = function(checked)
		{
			console.log("bounding box: " + checked);
			viewmodel.setShowBoundingBox(checked);
		}
		var handleShowScatterCubesChanged = function(checked)
		{
			console.log("scatter cubes: " + checked);
			viewmodel.setShowScatterCubes(checked);
		}
		var handleViewTop = function()
		{
			controller.setViewTop();
		}
		var handleViewSide = function()
		{
			controller.setViewSide();
		}
		// --trace=2 shapes as surfaces and/or lines, never neither: unchecking one checks the other
		var handleShapesChanged = function(cbx, otherId)
		{
			var other = document.getElementById(otherId);
			if (!cbx.checked) { other.checked = true; }
			controller.main.showShapes(document.getElementById("cbxSurfaces").checked, document.getElementById("cbxLines").checked);
		}
		var handleViewHome = function()
		{
			controller.setViewHome();
		}
		// tour: fly from component to component, sitting the given seconds at each (for movies)
		var handleTour = function(start)
		{
			controller.main.fly = null;
			var sel = document.getElementById("selTourComp");
			var on = document.getElementById("cbxTour").checked;
			document.getElementById("btnTourPause").style.display = on ? "block" : "none";
			if (!on) { sel.value = ""; handleTourPause(false); stopRecording(); return; }
			if (start && document.getElementById("cbxRecord").checked) { startRecording(""); }
			var num = function(id) { return parseFloat(document.getElementById(id).value) || 0; };
			var sit = controller.main.smooth ? 0 : parseFloat(document.getElementById("numSit").value);
			sel.value = controller.main.flyToNext(document.getElementById("cbxBeam").checked,
				["numOffX", "numOffY", "numOffZ"].map(num), ["numViewX", "numViewY", "numViewZ"].map(num),
				1000*(sit > 0 ? sit : 0), function() { // a campath file tour stops at its last point
					var m = controller.main;
					if (m.usePath && m.tourIdx == m.campath.length - 1) { endTour(); } else { handleTour(); }
				});
			if (recorder) {
				if (!recFirst) { recFirst = sel.value; }
				else if (recFirst == sel.value) { // one full loop recorded
					document.getElementById("cbxRecord").checked = false;
					stopRecording();
				}
			}
		}
		// tour paused (the camera can be moved) or going on, with the recording; button icon: play when paused, else pause
		var ICON_PLAY = '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>';
		var ICON_PAUSE = '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 4h4v16h-4zM14 4h4v16h-4z" fill="currentColor"/></svg>';
		var handleTourPause = function(paused)
		{
			controller.main.pauseTour(paused);
			document.getElementById("btnTourPause").innerHTML = paused ? ICON_PLAY : ICON_PAUSE;
			if (recorder) { if (paused) { recorder.pause(); } else { recorder.resume(); } }
		}
		// tour speed slider: 0.1x - 10x
		var handleTourSpeed = function(v)
		{
			controller.main.tourSpeed = Math.pow(10, v);
			document.getElementById("lblTourSpeed").innerHTML = controller.main.tourSpeed.toPrecision(2) + "x";
		}
		// a campath file tour stops at its last point
		var endTour = function()
		{
			document.getElementById("cbxTour").checked = false;
			document.getElementById("cbxRecord").checked = false;
			handleTour();
		}
		// campath file ticked/unticked: tour its points, or the components
		var handleCampath = function(checked)
		{
			controller.main.usePath = checked;
			controller.main.tourIdx = undefined;
			fillTourStops();
			if (document.getElementById("cbxTour").checked) { handleTour(); }
		}
		var fillTourStops = function()
		{
			var sel = document.getElementById("selTourComp");
			sel.length = 1;
			controller.main.tourStops().forEach(function(s) { sel.add(new Option(s.name, s.name)); });
		}
		// component picked from the list: the tour starts there (now, if it is on)
		var handleTourComp = function(name)
		{
			if (!name) { return; }
			controller.main.tourIdx = controller.main.tourStops().map(function(s) { return s.name; }).indexOf(name) - 1;
			if (document.getElementById("cbxTour").checked) { handleTour(); }
		}
		// record the canvas during a tour, downloaded as <instr>_tour.mp4 (or .webm) when the tour stops
		var recorder = null;
		var recFirst = null; // component the recording loop started at
		var startRecording = function(comp)
		{
			recFirst = comp;
			var type = ["video/mp4", "video/webm"].find(function(t) { return MediaRecorder.isTypeSupported(t); });
			var chunks = [];
			recorder = new MediaRecorder(controller.main.renderer.domElement.captureStream(30), {mimeType: type, videoBitsPerSecond: 8e6});
			recorder.ondataavailable = function(e) { chunks.push(e.data); };
			recorder.onstop = function() {
				var a = document.createElement("a");
				a.href = URL.createObjectURL(new Blob(chunks, {type: type}));
				a.download = MCDATA_instrdata["name"] + "_tour." + type.slice(6);
				a.click();
			};
			recorder.start();
		}
		var stopRecording = function()
		{
			if (recorder) { recorder.stop(); recorder = null; }
		}
		// Record ticked during a tour: start now, at the current component
		var handleRecord = function(checked)
		{
			if (!checked) { stopRecording(); }
			else if (document.getElementById("cbxTour").checked) { startRecording(document.getElementById("selTourComp").value); }
		}
	</script>

	<div id="gui" style="width: auto; background-color: black;">
		<span id="lblInstrInfo" style="color: white; border: 1px solid gray; border-radius: 3px; padding: 0 6px; cursor: help;">(instr)</span>
	</div>
	<div id="gui" style="width: auto; background-color: black;">
		<button id="btnPrev", onclick="handlePrev();" style="width: 90px;">Previous</button>
		<button id="btnPlayPause", onclick="handlePlayPause();" style="width: 90px;">Play/Pause</button>
		<button id="btnNext", onclick="handleNext();" style="width: 90px;">Next</button>
		<label id="lblRayIdxText" style="color: white;">Ray index</label>
		<label id="lblRayIdx" style="color: white; background-color: black; width: 27px; text-align: right; display: inline-block;">(idx)</label>
		<label id="lblMaxRayIdx" style="color: white; background-color: black; display: inline-block;">(max_idx)</label>
		<label id="lblKeep" style="color: white; background-color: black; display: inline-block; text-align:right; width: 140px;">
			Keep rays<input id="cbxKeep" type="checkbox">
		</label>
		<label id="lblScatterCubes" style="color: white; background-color: black; display: inline-block; text-align:right; width: 140px;">
			Scatter Markers<input id="cbxScattCub" type="checkbox">
		</label>
		<label id="lblView" style="color: white; background-color: black; display: inline-block; text-align:right; width: 120px;">Reset view:</label>
		<button id="btnHome", onclick="handleViewHome();" style="width: 60px;">Home</button>
		<button id="btnSide", onclick="handleViewSide();" style="width: 60px;">Side</button>
		<button id="btnTop", onclick="handleViewTop();" style="width: 60px;">Top</button>
		<label id="lblView" style="color: white; background-color: black; display: inline-block; text-align:right; width: 120px;">Show BB</label>
		<input id="cbxBoundingbox" type="checkbox">
		<label id="lblSurfaces" style="color: white; background-color: black; display: inline-block; text-align:right; width: 120px;">
			Surfaces<input id="cbxSurfaces" type="checkbox" checked autocomplete="off" onchange="handleShapesChanged(this, 'cbxLines');">
		</label>
		<label id="lblLines" style="color: white; background-color: black; display: inline-block; text-align:right; width: 80px;">
			Lines<input id="cbxLines" type="checkbox" autocomplete="off" onchange="handleShapesChanged(this, 'cbxSurfaces');">
		</label>
		<label id="lblOpacity" style="color: white; background-color: black; display: inline-block;">
			Opacity<input id="rngOpacity" type="range" min="0" max="1" step="0.05" value="0.4" autocomplete="off" style="width: 90px; vertical-align: middle;" oninput="controller.main.setSurfaceOpacity(parseFloat(this.value));">
		</label>
		<span id="lblMonitors" style="color: white; background-color: black; display: none;">Monitor data</span>
		<label id="lbl1D" style="color: white; background-color: black; display: none;" title="1D monitor data">
			1D<input id="cbx1D" type="checkbox" checked autocomplete="off" onchange="controller.main.showMonitorData('1D', this.checked);">
		</label>
		<label id="lbl2D" style="color: white; background-color: black; display: none;" title="2D monitor data">
			2D<input id="cbx2D" type="checkbox" checked autocomplete="off" onchange="controller.main.showMonitorData('2D', this.checked);">
		</label>
		<label id="lblCurved" style="color: white; background-color: black; display: none;" title="monitor data on cylinder, banana and sphere monitors">
			curved<input id="cbxCurved" type="checkbox" checked autocomplete="off" onchange="controller.main.showMonitorData('curved', this.checked);">
		</label>
		<label id="lblMonitorLog" style="color: white; background-color: black; display: none;" title="monitor data on a log scale">
			log<input id="cbxMonitorLog" type="checkbox" autocomplete="off" onchange="controller.main.setMonitorLog(this.checked);">
		</label>
		<span id="lblTour"style="color: white; background-color: black; display: inline-block;">
			<label>Tour<input id="cbxTour" type="checkbox" autocomplete="off" onchange="handleTour(true);"></label>
			<label title="record one loop of the tour from where it is, then download the video">Record<input id="cbxRecord" type="checkbox" autocomplete="off" onchange="handleRecord(this.checked);"></label>
			<span>sit<input id="numSit" type="number" min="0" step="0.5" value="0" style="width: 45px;">s</span>
			<label id="lblCampath" style="display: none;">campath file<input id="cbxCampath" type="checkbox" autocomplete="off" onchange="handleCampath(this.checked);"></label>
			<label title="no stops: travel through the components at a steady pace (sit is ignored)">Smooth<input id="cbxSmooth" type="checkbox" checked autocomplete="off" onchange="controller.main.smooth = this.checked;"></label>
			<span title="speed of the tour, also during a flight or sit">speed<input type="range" min="-1" max="1" step="0.05" value="0" autocomplete="off" style="width: 90px; vertical-align: middle;" oninput="handleTourSpeed(parseFloat(this.value));"><span id="lblTourSpeed" style="display: inline-block; width: 36px;">1.0x</span></span>
			<label>Move along beam<input id="cbxBeam" type="checkbox" checked autocomplete="off"></label>
			<span title="camera offset from the component origin (m), in the component frame">offset
			<input id="numOffX" type="number" step="0.1" value="0" style="width: 45px;"><input id="numOffY" type="number" step="0.1" value="0" style="width: 45px;"><input id="numOffZ" type="number" step="0.1" value="0" style="width: 45px;">m</span>
			<span title="added to the viewing direction 0 0 1, in the component frame (with Move along beam)">view
			<input id="numViewX" type="number" step="0.1" value="0" style="width: 45px;"><input id="numViewY" type="number" step="0.1" value="0" style="width: 45px;"><input id="numViewZ" type="number" step="0.1" value="0" style="width: 45px;"></span>
			<span><select id="selTourComp" autocomplete="off" style="max-width: 160px;" onchange="handleTourComp(this.value);" title="start the tour from here"><option value=""></option></select></span>
		</span>
	</div>
	<div id="3dcanvas"></div>
	<button id="btnTourPause" title="pause or continue the tour (the camera can be moved while paused)" onclick="handleTourPause(!controller.main.tourPaused);"></button>

	<script>
		// gui synchronization class
		//
		var UpdateGui = function()
		{
			this.vm_version = -1;
			this.viewmodel = viewmodel;
		}
		UpdateGui.prototype.update = function()
		{
			// return if viewmodel is constant
			if (this.vm_version == this.viewmodel.getUpdateVersion()) { return; }

			this.vm_version = this.viewmodel.getUpdateVersion();

			// update playback mode
			var pb = this.viewmodel.getPlayBack();
			if (pb == PlayBack.RUN)
			{
				btn = document.getElementById("btnPlayPause");
				btn.innerHTML = "Pause";
			}
			if (pb == PlayBack.PAUSE)
			{
				btn = document.getElementById("btnPlayPause");
				btn.innerHTML = "Play";
			}
			// update ray index
			lbl = document.getElementById("lblRayIdx");
			lbl.innerHTML = this.viewmodel.getRayIdx();

			// update keep ckeckbox
			cbxKeep = document.getElementById("cbxKeep");
			var dm = this.viewmodel.getDisplayMode();
			if (dm == DisplayMode.SINGLE)
			{
				cbxKeep.checked = false;
			}
			else
			{
				cbxKeep.checked = true;
			}

			// update show/hide scatter cubes
			cbxScattCub = document.getElementById("cbxScattCub");
			cbxScattCub.checked = this.viewmodel.getShowScatterCubes();

			// update bounding box checkbox
			cbxBoundingbox = document.getElementById("cbxBoundingbox");
			cbxBoundingbox.checked = this.viewmodel.getShowBoundingBox();
		}
		var upd = new UpdateGui();

		// set up static ui
		lblInstrInfo = document.getElementById("lblInstrInfo");
		// instrument name only; the full command line (parameters) on hover
		lblInstrInfo.textContent = MCDATA_instrdata["name"];
		lblInstrInfo.title = MCDATA_instrdata["cmd"];
		lblMaxRayIdx = document.getElementById("lblMaxRayIdx");
		lblMaxRayIdx.innerHTML = '/ ' + (MCDATA_particledata["numrays"] - 1);

		// set keep checkbox event handler
		cbxKeep = document.getElementById("cbxKeep");
		cbxKeep.addEventListener("change", function () { handleKeepChanged(cbxKeep.checked) });

		// set show bounding box event handler
		cbxBoundingbox = document.getElementById("cbxBoundingbox");
		cbxBoundingbox.addEventListener("change", function () { handleShowBBChanged(cbxBoundingbox.checked) });

		// set show bounding box event handler
		cbxScattCub = document.getElementById("cbxScattCub");
		cbxScattCub.addEventListener("change", function () { handleShowScatterCubesChanged(cbxScattCub.checked) });

		// call the mcdisplay app!
		controller.setUpdateGuiFunc(upd.update);
		controller.run();

		var mons = controller.main.monnodes.concat(controller.main.curvednodes);
		var showLbl = function(id, on) { if (on) { document.getElementById(id).style.display = "inline-block"; } };
		showLbl("lblMonitors", mons.length > 0);
		showLbl("lbl1D", mons.some(function(m) { return !m.userData.mon.z; }));
		showLbl("lbl2D", mons.some(function(m) { return m.userData.mon.z; }));
		showLbl("lblCurved", controller.main.curvednodes.length > 0);
		showLbl("lblMonitorLog", mons.length > 0);

		// tour component list
		var campath = MCDATA_instrdata["campath"];
		if (campath) {
			controller.main.setCampath(campath["points"]);
			var lbl = document.getElementById("lblCampath");
			lbl.style.display = "";
			lbl.title = "campath: " + campath["file"] + ", " + campath["points"].length + " points";
			document.getElementById("cbxCampath").checked = true;
			controller.main.usePath = true;
		}
		fillTourStops();
		document.getElementById("btnTourPause").innerHTML = ICON_PAUSE;
    </script>
</body>
</html>
