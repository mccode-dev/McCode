name: mcstas-ess-instruments

# Runs the ESS instrument repositories that follow the standard layout (as
# listed by mcstas-ess-instr-citool) through "runci", with McStas built from
# this McCode checkout instead of the conda-forge release. The environment is the
# repository's conda.yml without mcstas, plus McCode's own dependencies.
#
# Repositories which are not public need the secret DMSC_GITLAB_TOKEN (a
# GitLab token with read_repository access); otherwise they are skipped.
on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CITOOL: git+https://github.com/mccode-dev/mcstas-ess-instr-citool

jobs:

  list:
    name: List the repositories
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
      all: ${{ steps.list.outputs.all }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - id: list
        run: |
          set -euo pipefail
          python -m pip install --no-deps "$CITOOL"
          mcstas-ess-instr-citool -a repos
          all=$(mcstas-ess-instr-citool -a repos-json)
          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "repos=$(jq -c 'map(select(.standard_layout))' <<< "$all")" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.repo.name }}
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.list.outputs.repos) }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      REPO_URL: ${{ matrix.repo.url }}
      REPO_PUBLIC: ${{ matrix.repo.public }}
      GITLAB_TOKEN: ${{ secrets.DMSC_GITLAB_TOKEN }}
    steps:
      - name: Clone ${{ matrix.repo.url }}
        id: clone
        shell: bash
        run: |
          set -euo pipefail
          url="$REPO_URL"
          if [ "$REPO_PUBLIC" != "true" ]; then
            if [ -z "$GITLAB_TOKEN" ]; then
              echo "::notice::Skipping: not public, and DMSC_GITLAB_TOKEN is not set."
              exit 0
            fi
            url="https://oauth2:${GITLAB_TOKEN}@${REPO_URL#https://}"
          fi
          git clone --depth 1 "$url.git" repo
          git -C repo log -1 --format='Testing commit %h (%cd): %s'
          echo "cloned=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.clone.outputs.cloned == 'true'
        with:
          path: src

      - name: Merge conda.yml with the McCode dependencies
        if: steps.clone.outputs.cloned == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Appending to the dependencies list needs it to be last and flat:
          if grep -qE '^[[:space:]]*-[[:space:]]*pip:' repo/conda.yml; then
            echo "::error::pip: section in conda.yml is not supported here"; exit 1
          fi
          { sed -E '/^[[:space:]]*-[[:space:]]*mcstas[[:space:]]*([<>=!].*)?$/d' repo/conda.yml
            ./src/devel/bin/mccode-create-conda-yml -m mcstas | sed '1,/^dependencies:/d'
          } > env.yml
          cat env.yml

      - uses: mamba-org/setup-micromamba@v3
        if: steps.clone.outputs.cloned == 'true'
        with:
          environment-file: env.yml
          environment-name: instrument

      - name: Build and install McCode
        if: steps.clone.outputs.cloned == 'true'
        run: |
          ./src/devel/bin/mccode-build-conda -m mcstas -s $PWD/src -b $PWD/build_mcstas
          git -C src log -1 --format='McCode at %h (%cd): %s'
          mcstas --version

      - name: Run the tests (runci)
        id: runci
        if: steps.clone.outputs.cloned == 'true'
        run: |
          python -m pip install --no-deps "$CITOOL"
          mcstas-ess-instr-citool -a runci -o $PWD/out $PWD/repo

      # runci runs mctest with --noplots: make the 01_overview.pdf of each test
      # output as mctest does (linked from the mcviewtest table)
      - name: PDF overview plots
        if: always() && steps.runci.outcome != 'skipped'
        run: |
          for d in out/tests/*/*/[0-9]*/; do
            [ -f "${d}mccode.sim" ] || [ -f "${d}mccode.dat" ] || continue
            mcplot-matplotlib "$d" --format=pdf --output "${d}01_overview.pdf" || echo "::warning::no PDF plot of $d"
          done

      # One column of the nightly site per instrument (also when a step failed)
      - name: Collect the results
        if: always() && steps.clone.outputs.cloned == 'true'
        shell: bash
        run: |
          set -euo pipefail
          outcome="${{ steps.runci.outcome }}"
          python3 src/tools/nightly-site/ess_column.py out "${{ matrix.repo.name }}" "${outcome:-skipped}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" ess-nightly
          ./src/devel/bin/mccode-simdir-cleanfiles -d ess-nightly
          tar czf ess-column.tgz ess-nightly
      - uses: actions/upload-artifact@v6
        if: always() && steps.clone.outputs.cloned == 'true'
        with:
          name: ess-column-${{ matrix.repo.name }}
          path: ess-column.tgz

  nightly:
    name: Nightly site
    needs: [list, test]
    if: always() && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
        with:
          path: src

      # McCode for mcviewtest, installed as in the test jobs
      - name: Get conda dependency list
        run: ./src/devel/bin/mccode-create-conda-yml -m mcstas -n mcstas -o dependencies.yml
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: mcstas
          environment-file: dependencies.yml
      - name: Build and install McCode
        run: ./src/devel/bin/mccode-build-conda -m mcstas -s $PWD/src -b $PWD/build_mcstas

      - uses: actions/download-artifact@v6
        with:
          pattern: ess-column-*
          path: columns

      - name: Merge the columns and run mcviewtest
        id: viewtest
        env:
          REPOS: ${{ needs.list.outputs.all }}
        run: |
          set -euo pipefail
          for t in columns/*/ess-column.tgz; do tar xzf "$t"; done
          # all repositories, for the table on the site (tools/nightly-site/index.html)
          echo "$REPOS" > ess-nightly/repos.json
          cd ess-nightly
          mcviewtest --nobrowse --nodiff

      # Same as the mcstas-conda-testsuite compare job, for mccode-dev/ess-instrument-nightly
      - name: Raw data per instrument as release assets in ess-instrument-nightly
        if: steps.viewtest.outcome == 'success' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_TOKEN }}
        run: |
          set -euo pipefail
          day=$(date -u +%F)
          echo "NIGHT=$day" >> "$GITHUB_ENV"
          repo=mccode-dev/ess-instrument-nightly
          cd ess-nightly
          for col in */; do
            col=${col%/}
            [ "$col" = _lib ] && continue
            # same column key as tools/nightly-site/summarize.py column_key()
            key=$(echo "$col" | cut -d_ -f2- | rev | cut -d_ -f2- | rev)
            mkdir ../rel
            for instr in "$col"/*/; do
              tar czf "../rel/$(basename "$instr").tgz" "${instr%/}"
            done
            gh release create "${day}_${key}" -R $repo --title "${day} ${key}" \
              --notes "Raw output of $key from https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" ../rel/*.tgz
            rm -rf ../rel
          done
          # ponytail: fixed 14-night retention of the raw data, tune if release storage matters
          gh release list -R $repo --limit 1000 --json tagName,createdAt \
            -q ".[] | select(.createdAt < \"$(date -u -d '14 days ago' +%FT%TZ)\") | .tagName" |
            xargs -r -n1 gh release delete -R $repo --yes --cleanup-tag

      - name: Strip data files, keeping what the nightly site shows
        id: site
        if: steps.viewtest.outcome == 'success'
        run: |
          set -euo pipefail
          find ess-nightly -type f ! \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.txt' -o -name '*.pdf' -o -name '*.png' -o -name '*.svg' -o -name '*.instr' -o -name '*.sim' -o -name '*.failed' \) -delete
          tar czf ess-nightly-site.tgz ess-nightly
          ls -l ess-nightly-site.tgz
      - id: site-upload
        uses: actions/upload-artifact@v6
        if: steps.site.outcome == 'success'
        with:
          name: ess-nightly-site
          path: ess-nightly-site.tgz

      # Publishes via McCode's reusable nightly-site.yml (tools/nightly-site/)
      - name: Trigger the ess-instrument-nightly site deploy
        if: steps.site-upload.outcome == 'success' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_TOKEN }}
        run: |
          gh api repos/mccode-dev/ess-instrument-nightly/dispatches -f event_type=nightly \
            -f 'client_payload[flavor]=ess' -f 'client_payload[run_id]=${{ github.run_id }}' \
            -f "client_payload[date]=${NIGHT:-$(date -u +%F)}"
