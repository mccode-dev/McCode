name: check-doc-params
on:
  pull_request:
    paths:
      - '**/*.comp'
      - '**/*.instr'
      - 'devel/bin/mccode-check-doc-params'
      - 'devel/bin/mccode-clangformat'
      - '.clang-format'
      - '.github/workflows/check-doc-params.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: pipx install clang-format==23.1.4  # pinned: output differs between versions
      - name: Changed components and instruments document all input parameters
        run: |
          set -euo pipefail
          git diff -z --name-only --diff-filter=AM "origin/${{ github.base_ref }}..." -- '*.comp' '*.instr' \
            | xargs -0 -r sh -c './devel/bin/mccode-check-doc-params "$@" || exit 1' _  # exit 255 would stop xargs
