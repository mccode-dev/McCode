name: freebsd

# Source build of McStas/McXtrace in a FreeBSD VM, after the approach in
# mctools/mcpl and mctools/ncrystal (.github/workflows/freebsd.yml).
# Tests follow {mcstas,mcxtrace}-basictest.yml (classic cogen, no KDSource/xraylib),
# artifacts use their naming so they can sit next to the other platforms' output.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 22 * * 0'  # 22:30 every Sunday
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: mcstas
            build: BUILD_MCSTAS
            mcrun: mcrun
            mctest: mctest
            mpilists: Tests_monitors
            pip: mcpl ncrystal
            instr: BNL_H8,ISIS_CRISP,templateSANS_Mantid,NCrystal_example,ESS_BEER_MCPL,Test_MCPL_input,Test_MCPL_output,Masked_ESS_butterfly_image
          - flavor: mcxtrace
            build: BUILD_MCXTRACE
            mcrun: mxrun
            mctest: mxtest
            mpilists: Tests
            pip: mcpl
            instr: JJ_SAXS,ESRF_BM29,Test_MCPL_input,Test_MCPL_output
    name: freebsd.${{ matrix.flavor }}
    runs-on: ubuntu-latest
    env:
      LABEL: ${{ matrix.flavor }}-classic.freebsd.freebsd-14.2.cc.mpich.python-pkg
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: src

      - name: FreeBSD
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          version: '14.2'
          run: |
            set -eux
            # FreeBSD's clang does not search /usr/local, so GSL and HDF5 dirs are passed explicitly.
            # mpich, not openmpi: the openmpi pkg keeps mpicc/mpirun outside PATH.
            # MPI builds use base cc + mpich paths, not mpich's mpicc: mpicc links with binutils ld,
            # which lacks LLVMgold.so for the -flto that cmake probed with cc/lld.
            # Python modules by port origin: follows the default Python flavour (pyXYZ-) on pkg updates.
            sudo pkg install -y devel/cmake-core bison flex gsl hdf5 mpich python3 devel/py-pip devel/py-pyyaml devel/py-ply sysutils/py-psutil math/py-numpy science/py-h5py
            # MCPL (and NCrystal for McStas) from PyPI (sdist builds, as in their own FreeBSD CI);
            # McCode finds them at instrument compile time via mcpl-config / ncrystal-config on PATH.
            python3 -mpip install --user ${{ matrix.pip }}
            PATH="$HOME/.local/bin:$PATH"
            export PATH
            for p in ${{ matrix.pip }}; do $p-config --show buildflags; done
            cmake -S ./src -B ./build \
                -DCMAKE_INSTALL_PREFIX=$PWD/install \
                -DCMAKE_BUILD_TYPE=Release \
                -DMCVERSION="3.99.99" \
                -DMCCODE_BUILD_CONDA_PKG=OFF \
                -DMCCODE_USE_LEGACY_DESTINATIONS=OFF \
                -DBUILD_SHARED_LIBS=ON \
                -DCMAKE_INSTALL_LIBDIR=lib \
                -D${{ matrix.build }}=ON \
                -DBUILD_TOOLS=ON \
                -DENABLE_COMPONENTS=ON \
                -DENSURE_MCPL=OFF \
                -DENSURE_NCRYSTAL=OFF \
                -DENABLE_CIF2HKL=OFF \
                -DENABLE_NEUTRONICS=OFF \
                -DGSLFLAGS="-I/usr/local/include -Wl,-rpath,/usr/local/lib -L/usr/local/lib -lgsl -lgslcblas" \
                -DNEXUSLIB=/usr/local/lib \
                -DNEXUSINCLUDE=/usr/local/include \
                -DMPICC=cc \
                -DMPILIBDIR=/usr/local/lib \
                -DMPIINCLUDEDIR=/usr/local/include
            cmake --build ./build --config Release --parallel 2
            cmake --install ./build --config Release
            PATH="$PWD/install/bin:$PATH"
            export PATH
            cat install/share/${{ matrix.flavor }}/tools/Python/mccodelib/mccode_config.json
            ${{ matrix.flavor }} --version
            # RNG test (same expected checksum as the basictests)
            ${{ matrix.mctest }} --verbose --noplots --instr=Test_RNG_rand01 --testdir=run_rngtest --suffix=classic_freebsd --uid=freebsd
            SUM=$(find run_rngtest -name rngout.dat | xargs -n1 grep -v \# | md5 -q)
            test "$SUM" = "6c203d69205b0656c1391555e6068c93"
            # Basic tests
            ${{ matrix.mctest }} --verbose --noplots --mpi=2 --instr=${{ matrix.instr }} --testdir=run_basictests --suffix=classic_freebsd_cc_mpich --uid=freebsd
            # MPI event-list, NeXus output and mcplot loader regression tests.
            # No SIGTERM check: the runtime installs its sighandler with OpenMPI only (MPICH uses signals).
            python3 src/${{ matrix.flavor }}-comps/examples/${{ matrix.mpilists }}/Test_Monitor_nD_list_MPI/test_mpi_lists.py --np 2 --mcrun ${{ matrix.mcrun }} --workdir run_mpilists --sigterm-ncount 0
            python3 src/${{ matrix.flavor }}-comps/examples/Tests_other/Test_NeXus_output/test_nexus_output.py --np 2 --mcrun ${{ matrix.mcrun }} --workdir run_nexusoutput
            python3 src/${{ matrix.flavor }}-comps/examples/Tests_other/Test_mcplot_loader/test_mcplot_loader.py --mcrun ${{ matrix.mcrun }} --workdir run_mcplotloader

      # The VM syncs the work dir back to the host on teardown, also after a failure
      - name: 'Tar output files'
        if: always()
        run: |
             set -eux
             ls | grep run_ | xargs -n1 ./src/devel/bin/mccode-simdir-cleanfiles -d
             tar cvfz ${LABEL}_output.tgz run_*

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.flavor }}-artefacts-classic.freebsd.freebsd-14.2.cc.mpich.python-pkg
          path: ${{ env.LABEL }}_output.tgz

      - name: 'Tar logs of failed tests'
        if: always()
        run: |
             set -eux
             { find run_* -name '*.failed' 2>/dev/null || true
               grep -rl --include='*.json' --exclude='testresults_*' '"failed": true' run_* 2>/dev/null || true
             } | sed 's#/[^/]*$##' | sort -u | while read -r d; do
               find "$d" -maxdepth 1 -type f \( -name '*.txt' -o -name '*.failed' -o -name '*.json' \)
             done > failed_logs.txt
             if [ -s failed_logs.txt ]; then tar cvfz ${LABEL}_failedlogs.tgz -T failed_logs.txt; fi

      - name: 'Upload failed-test logs'
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.flavor }}-failedlogs-classic.freebsd.freebsd-14.2.cc.mpich.python-pkg
          path: ${{ env.LABEL }}_failedlogs.tgz
          if-no-files-found: ignore
