name: mcstas-basictest
on:
  push:
  pull_request:
  schedule:
    - cron: '30 23 * * 0'  # 23:30 every Sunday

  workflow_dispatch:
    inputs:
      manual-debugging:
        type: boolean
        description: Launch manual debugging tmate for inspection (automatic in case of errors)
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- built from source via cmake ---
          - { method: source, os: ubuntu-24.04,   CC: gcc-13,   CXX: g++-13,     python: '3.13', mpi: 'openmpi', nmpi: 'auto', cogen: ''}
          - { method: source, os: ubuntu-24.04,   CC: clang,    CXX: clang++,    python: '3.13', mpi: 'openmpi', nmpi: 'auto', cogen: ''}
          # --- built via conda ---
          - { method: conda,  os: ubuntu-latest,  CC: gcc,   CXX: g++,  python: '3.13', mpi: 'openmpi', nmpi: 'auto', cogen: ''}
          - { method: conda,  os: ubuntu-latest,  CC: gcc,   CXX: g++,  python: '3.13', mpi: 'openmpi', nmpi: 'auto', cogen: 'mcstas-antlr'}
          - { method: conda,  os: macos-latest,  CC: clang,  CXX: clang++,   python: '3.13', mpi: 'openmpi', nmpi: '2', cogen: ''}
          - { method: conda,  os: windows-latest, CC: cl.exe,   CXX: cl.exe,  python: "3.13",  mpi: 'msmpi', nmpi: 'auto', cogen: ''}

    name: ${{ matrix.os }}.${{ matrix.method }}.${{ matrix.cogen }}.${{ matrix.CC || 'default' }}.${{ matrix.mpi }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        path: src
        # Full history (rather than the old fetch-depth: 2) is needed so the
        # "Check for modified instruments" step below can diff against the
        # actual merge-base with main / the pre-push SHA, rather than just
        # the single most recent commit - see that step for why.
        fetch-depth: 0

    - name: Setup python
      uses: actions/setup-python@v6
      if: matrix.method == 'source'
      with:
        python-version: ${{ matrix.python }}

    - name: Setup VS in shell Intel
      if: runner.os == 'Windows' && matrix.os != 'windows-11-arm'
      uses: egor-tensin/vs-shell@v2

    - name: Setup VS in shell arm64
      if: runner.os == 'Windows' && matrix.os == 'windows-11-arm'
      uses: egor-tensin/vs-shell@v2
      with:
        arch: arm64

    - name: Setup MPI
      uses: mpi4py/setup-mpi@v1
      if: matrix.method == 'source'
      with:
        mpi: ${{ matrix.mpi }}

    - name: Setup (Linux, source build)
      id: setup-linux
      if: matrix.method == 'source' && runner.os == 'Linux'
      run: |
           sudo apt -y install libgsl-dev libnexus-dev

    - name: Setup (macOS, source build)
      id: setup-macos
      if: matrix.method == 'source' && runner.os == 'macOS'
      run: |
           brew install bison flex gfortran gsl homebrew/science/nexusformat

    - name: Setup (Windows, source build)
      id: setup-Windows
      if: matrix.method == 'source' && runner.os == 'Windows'
      shell: bash
      run:   |
        cygpath -sm "$MSMPI_INC" > includepath.txt
        cygpath -sm "$MSMPI_LIB64" > libpath.txt
        choco install winflexbison3
        choco install wget
        if [ "$CC" == "gcc.exe" ]; then choco install mingw; fi
        pip install mslex PyYAML ply ncrystal mcpl mcpl-extra kdsource psutil jinja2
        gcc.exe --version

    - name: Setup (Windows Intel, source build)
      id: setup-Windows-intel
      if: matrix.method == 'source' && runner.os == 'Windows' && matrix.os != 'windows-11-arm'
      shell: bash
      run:   |
        pip install McStasscript ncrystal

    - name: Setup MPI cygpath...
      id: setup-Windows-paths
      if: matrix.method == 'source' && runner.os == 'Windows'
      run: |
        set /p MPIINCVAR=<includepath.txt
        set /p MPILIBVAR=<libpath.txt
        echo MPIINCVAR=%MPIINCVAR% >> %GITHUB_ENV%
        echo MPILIBVAR=%MPILIBVAR% >> %GITHUB_ENV%

    - name: Check versions
      id: version-checks
      run: |
           which python3
           python3 --version
           which cmake
           cmake --version

    - name: Get conda dependency list
      id: conda-deps
      if: matrix.method == 'conda'
      run: |
           ./src/devel/bin/mccode-create-conda-yml -m mcstas -n mcstas -o dependencies.yml
           cat dependencies.yml

    - uses: mamba-org/setup-micromamba@v3
      if: matrix.method == 'conda'
      with:
        environment-name: mcstas
        environment-file: dependencies.yml

    - name: Configure build and install mcstas (source)
      id: mcstas-install
      if: ${{ matrix.method == 'source' && matrix.CC != 'cl.exe' }}
      run: |
           if [ "$RUNNER_OS" == "macOS" ]; then mkdir ${HOME}/tmp; fi
           if [ "$RUNNER_OS" == "macOS" ]; then export SDKROOT=$(xcrun --sdk macosx --show-sdk-path); fi
           set -e
           set -u
           set -x
           mkdir build_mcstas
           cd build_mcstas
           export EXTRA_ARGS_FOR_CMAKE=""
           if [ "$RUNNER_OS" == "macOS" ] && [ -f "/opt/homebrew/opt/flex/bin/flex" ]; then export HOMEBRW="/opt/homebrew/opt"; export GSLFLAGS="-lgsl -lgslcblas -L/opt/homebrew/lib -I/opt/homebrew/include"; fi
           if [ "$RUNNER_OS" == "macOS" ] && [ -f "/usr/local/opt/flex/bin/flex" ]; then export HOMEBRW="/usr/local/opt"; export GSLFLAGS="-lgsl -lgslcblas -L/usr/local/lib -I/usr/local/include"; fi
           if [ "$RUNNER_OS" == "macOS" ]; then export EXTRA_ARGS_FOR_CMAKE="-DBISON_EXECUTABLE=${HOMEBRW}/bison/bin/bison -DFLEX_EXECUTABLE=${HOMEBRW}/flex/bin/flex -DCMAKE_Fortran_COMPILER=${HOMEBRW}/gfortran/bin/gfortran"; fi
           if [ "$RUNNER_OS" == "Linux" ]; then export EXTRA_ARGS_FOR_CMAKE="-DNEXUSLIB=/usr/lib -DNEXUSINCLUDE=/usr/include/nexus"; fi
           if [ "$RUNNER_OS" == "Windows" ]; then export MPIINC=`cygpath -m -s  "${MSMPI_INC}"`; export MPILIB=`cygpath -m -s  "${MSMPI_LIB64}"`; export EXTRA_ARGS_FOR_CMAKE="-DMPILIBDIR=${MPILIB} -DMPIINCLUDEDIR=${MPIINC}"; fi
           cmake \
               -DCMAKE_INSTALL_PREFIX=../install_mcstas \
               -S ../src \
               -G "Unix Makefiles" \
               -DMCVERSION="3.99.99" \
               -DMCCODE_BUILD_CONDA_PKG=OFF \
               -DBUILD_SHARED_LIBS=ON \
               -DCMAKE_INSTALL_LIBDIR=lib \
               -DCMAKE_BUILD_TYPE=Release \
               -DBUILD_MCSTAS=ON \
               -DMCCODE_USE_LEGACY_DESTINATIONS=OFF \
               -DBUILD_TOOLS=ON \
               -DENABLE_COMPONENTS=ON \
               -DENSURE_MCPL=OFF \
               -DENSURE_NCRYSTAL=OFF \
               -DENABLE_CIF2HKL=ON \
               -DENABLE_NEUTRONICS=OFF \
               ${EXTRA_ARGS_FOR_CMAKE}
           cmake --build . --config Release
           cmake --build . --target install --config Release
           export MCSTAS_EXECUTABLE="mcstas"
           export MCRUN_EXECUTABLE="mcrun"
           if [ "$RUNNER_OS" == "Windows" ];
           then
             export MCSTAS_EXECUTABLE="mcstas.exe"
             export MCRUN_EXECUTABLE="mcrun.bat"
           fi
           test -f "../install_mcstas/bin/${MCSTAS_EXECUTABLE}"
           test -f "../install_mcstas/bin/${MCRUN_EXECUTABLE}"
           test -f "../install_mcstas/share/mcstas/tools/Python/mccodelib/__init__.py"
           test -d "../install_mcstas/share/mcstas/resources/data"
           if [ "${{ matrix.mpi }}" == "openmpi" ]; then sed -i.bak 's/mpirun/mpirun\ --verbose\ --mca\ btl\ self,vader,tcp/g' ../install_mcstas/share/mcstas/tools/Python/mccodelib/mccode_config.json ; fi
           if [ "$RUNNER_OS" == "macOS" ]; then sed -i.bak "s+-lgsl\ -lgslcblas+${GSLFLAGS}+g" ../install_mcstas/share/mcstas/tools/Python/mccodelib/mccode_config.json ; fi
           echo *******************************************************************************
           echo Resulting mccode_config.json:
           echo *******************************************************************************
           cat ../install_mcstas/share/mcstas/tools/Python/mccodelib/mccode_config.json
           echo *******************************************************************************

    - name: Configure build and install mcstas on Windows-MSVC (source)
      id: mcstas-install-windows-msvc
      if: ${{ matrix.method == 'source' && matrix.CC != 'gcc.exe' && runner.os == 'Windows' }}
      shell: cmd
      run: >
        cmake -B build -S src
        "-DCMAKE_INSTALL_PREFIX=./install_mcstas"
        -DMCVERSION="3.99.99"
        -DMCCODE_BUILD_CONDA_PKG=OFF
        -DMCCODE_CONFIG_MCPL2=ON
        -DCMAKE_INSTALL_LIBDIR=lib
        -DBUILD_MCSTAS=ON
        -DMCCODE_USE_LEGACY_DESTINATIONS=OFF
        -DBUILD_TOOLS=ON
        -DENABLE_COMPONENTS=ON
        -DENABLE_CIF2HKL=OFF
        -DENABLE_NEUTRONICS=OFF
        -DMPIINCLUDEDIR=%MPIINCVAR%
        -DMPILIBDIR=%MPILIBVAR%

    - name: CMake build (source, Windows-MSVC)
      if: ${{ matrix.method == 'source' && matrix.CC != 'gcc.exe' && runner.os == 'Windows' }}
      shell: cmd
      run: cmake --build build --config Release -j 2

    - name: CMake install (source, Windows-MSVC)
      if: ${{ matrix.method == 'source' && matrix.CC != 'gcc.exe' && runner.os == 'Windows' }}
      run: cmake --install build --config Release

    - name: set MCSTAS env var (source, Windows)
      if: matrix.method == 'source' && runner.os == 'Windows'
      run: echo MCSTAS=%CD%\install_mcstas\share\mcstas\resources >> %GITHUB_ENV%

    - name: check MCSTAS env var (source, Windows)
      if: matrix.method == 'source' && runner.os == 'Windows'
      run: echo %MCSTAS%

    - name: Various Windows debugging - McStas (source)
      if: matrix.method == 'source' && runner.os == 'Windows'
      shell: cmd
      run: |
        type .\install_mcstas\share\mcstas\tools\Python\mccodelib\mccode_config.json
        .\install_mcstas\bin\mcrun -h
        .\install_mcstas\bin\mcstas -v
        if [ "${{ matrix.CC }}" != "cl.exe" ];
        then
          mcpl-config -s
          ncrystal-config -s
        fi

    - name: Various Windows debugging - MCPL and NCrystal (source)
      if: matrix.method == 'source' && runner.os == 'Windows'
      run: |
        mcpl-config -s
        ncrystal-config -s

    - name: Pip install Unix (source)
      id: pip-install
      if: matrix.method == 'source' && runner.os != 'Windows'
      run: |
           set -e
           set -u
           set -x
           if [ "$RUNNER_OS" == "macOS" ];
           then
             python3 -mpip install PyYAML pyaml ply McStasScript ncrystal mcpl mcpl-extra kdsource jinja2 psutil --break-system-packages
           fi
           if [ "$RUNNER_OS" == "Linux" ];
           then
             python3 -mpip install PyYAML ply McStasscript ncrystal mcpl mcpl-extra kdsource jinja2 psutil
           fi

    - name: Configure build and install mcstas (conda)
      id: mcstas-install-conda
      if: matrix.method == 'conda'
      run: |
           ./src/devel/bin/mccode-build-conda -m mcstas -s $PWD/src -b $PWD/build_mcstas

    - name: Setup mcstas-antlr
      id: setup-mcstas-antlr
      if: matrix.cogen == 'mcstas-antlr'
      continue-on-error: true
      run: |
        # Cache checkout src/ with mccode-antlr
        if [ "${{ matrix.cogen }}" == "mcstas-antlr" ];
        then
          mccode-antlr cache populate --from-path src/ --flavor mcstas
          MCCODE_CONFIG=`mcrun --write-user-config | cut -f4 -d\ `
          sed -i.bak s+\"MCCOGEN\"\:\ \"mcstas\",+\"MCCOGEN\"\:\ \"mcstas-antlr\",+g ${MCCODE_CONFIG}
          grep COGEN ${MCCODE_CONFIG}
        fi

    - name: Validate build output (conda)
      id: build-validation
      if: always() && matrix.method == 'conda'
      run: |
           set -e
           set -u
           set -x
           if [ "$RUNNER_OS" == "Windows" ];
           then
             echo "Validating Windows build output..."
             echo "CONDA_PREFIX: $CONDA_PREFIX"
             echo "Checking for mcstas executable..."
             test -f ${CONDA_PREFIX}/bin/mcstas || test -f ${CONDA_PREFIX}/bin/mcstas.bat || { echo "ERROR: mcstas not found"; exit 1; }
             echo "Checking for mctest executable..."
             test -f ${CONDA_PREFIX}/bin/mctest.bat || { echo "ERROR: mctest.bat not found"; ls -la ${CONDA_PREFIX}/bin/ | grep -i mctest || echo "No mctest found"; exit 1; }
           else
             echo "Validating Unix build output..."
             test -f ${CONDA_PREFIX}/bin/mcstas || { echo "ERROR: mcstas not found"; exit 1; }
             test -f ${CONDA_PREFIX}/bin/mctest || { echo "ERROR: mctest not found"; exit 1; }
           fi

    - name: Post install openmpi hacks macOS (conda)
      id: post-install-openmpi-hacks-macOS
      if: matrix.method == 'conda' && runner.os == 'macOS'
      run: |
           if [ "${{ matrix.mpi }}" == "openmpi" ]; then
               sed -i.bak 's+mpirun+mpirun\ -mca\ regx\ naive\ --verbose\ --mca\ btl_tcp_if_include\ lo0+g' ${CONDA_PREFIX}/share/mcstas/tools/Python/mccodelib/mccode_config.json
           fi

    - name: Normalize PATH to installed McStas tools
      id: normalize-path
      run: |
           # For source builds, put the freshly-installed bin/ on PATH so the
           # shared test steps below can invoke bare `mcstas`/`mctest`/etc,
           # exactly like the conda builds already can (conda's own
           # environment activation, via `shell: bash -el`, already puts
           # $CONDA_PREFIX/bin on PATH every step - nothing extra needed there).
           if [ "${{ matrix.method }}" == "source" ]; then
             echo "$PWD/install_mcstas/bin" >> "$GITHUB_PATH"
           fi

    # Start of tests (shared across all 5 matrix legs)
    - name: Launch RNG test instrument
      id: RNG-test
      run: |
           set -e
           set -u
           set -x
           export MD5SUM="md5sum"
           if [ "$RUNNER_OS" == "macOS" ];
           then
             export MD5SUM="md5"
           fi
           if [ "$RUNNER_OS" == "Windows" ];
           then
             export SUFFIX=".bat"
             export EXESUFFIX=".exe"
           else
            export SUFFIX=""
            export EXESUFFIX=""
           fi
           test -n "$(command -v mcstas${EXESUFFIX})"
           mcstas${EXESUFFIX} --version
           mctest${SUFFIX} --instr=Test_RNG_rand01 --testdir=run_rngtest --suffix=${{ matrix.cogen }}_${{ matrix.method }} --uid=${RUNNER_TRACKING_ID}
           export SUM=`find run_rngtest -name rngout.dat | xargs -n1 grep -v \# | ${MD5SUM} | cut -f1 -d\ `
           export EXPECTED="f192ce4609e2225bf9d42ce9c5fa5a86"
           if [ "${EXPECTED}" == "${SUM}" ];
           then
              echo RNG test success!
              true
           else
              echo RNG test failure!
              false
           fi

    - name: Launch basic tests
      id: basictests
      run: |
           set -e
           set -u
           set -x
           if [ "$RUNNER_OS" == "Windows" ];
           then
             export SUFFIX=".bat"
             export EXESUFFIX=".exe"
           else
            export SUFFIX=""
            export EXESUFFIX=""
           fi
           test -n "$(command -v mcstas${EXESUFFIX})"
           mcstas${EXESUFFIX} --version
           mctest${SUFFIX} --instr=BNL_H8,ISIS_CRISP,templateSANS_Mantid,NCrystal_example,ESS_BEER_MCPL,Test_MCPL_input,Test_MCPL_output,Test_KDSource --testdir=run_basictests --suffix=${{ matrix.cogen }}_${{ matrix.method }} --uid=${RUNNER_TRACKING_ID}
           mctest${SUFFIX} --mpi=${{ matrix.nmpi }} --instr=BNL_H8,ISIS_CRISP,templateSANS_Mantid,NCrystal_example,ESS_BEER_MCPL,Test_MCPL_input,Test_MCPL_output,Test_KDSource --testdir=run_basictests --suffix=${{ matrix.cogen }}_${{ matrix.method }}_${{ matrix.mpi }} --uid=${RUNNER_TRACKING_ID}

    - name: Check for modified instruments
      id: instr-test
      run: |
           set -e
           set -u
           set -x
           export MCTEST_EXECUTABLE="mctest"
           export MCVIEWTEST_EXECUTABLE="mcviewtest"
           if [ "$RUNNER_OS" == "Windows" ];
           then
             export MCTEST_EXECUTABLE="mctest.bat"
             export MCVIEWTEST_EXECUTABLE="mcviewtest.bat"
           fi
           export PERMISSIVE=" "

           # Determine which base commit to diff against, robustly - this
           # replaces the old `git diff --name-only HEAD HEAD~1`, which only
           # ever considers the single most recent commit. That silently
           # misses changes whenever a PR or push contains more than one
           # commit (verified: a 3-commit PR touching 3 different files was
           # only detected as a 1-file change under the old logic).
           #
           # - pull_request / pushes to non-main branches: diff against the
           #   merge-base with origin/main, so every commit since branching
           #   off main is considered, however many there are and regardless
           #   of rebases/force-pushes on the branch itself.
           # - direct pushes to main: origin/main already includes this very
           #   push by the time we fetch it, so merge-base against it would
           #   wrongly show zero changes. Diff against the pre-push SHA
           #   (github.event.before) instead, so a multi-commit push to main
           #   still gets its full set of changes considered.
           cd src
           git fetch origin main --quiet || true
           if [ "${{ github.ref }}" == "refs/heads/main" ] && [ "${{ github.event_name }}" == "push" ]; then
             export DIFFBASE="${{ github.event.before }}"
             if [ -z "$DIFFBASE" ] || [ "$DIFFBASE" == "0000000000000000000000000000000000000000" ]; then
               export DIFFBASE=$(git rev-parse HEAD~1)
             fi
           else
             export DIFFBASE=$(git merge-base origin/main HEAD)
           fi
           echo "Diffing against: $DIFFBASE"

           export CHANGEDCOMPS=`git diff --name-only $DIFFBASE HEAD | grep \.comp\$ | grep mcstas-comps | xargs -n1 basename | sed s/\.comp//g | sort | uniq | xargs echo`
           export NUMCHANGEDCOMPS=`git diff --name-only $DIFFBASE HEAD | grep \.comp\$ | grep mcstas-comps | wc -l | xargs echo`
           cd -
           if [ "$NUMCHANGEDCOMPS" != "0" ];
           then
               for comp in $CHANGEDCOMPS;
               do
                 echo Finding tests including component $comp
                 NUMMATCH=`find src/mcstas-comps -name \*.instr -exec grep -H ${comp} \{\} \; | cut -f1 -d: | sort | uniq | wc -l`
                 if [ "$NUMMATCH" -gt "0" ];
                 then
                   ${MCTEST_EXECUTABLE} --mpi=${{ matrix.nmpi }} --testdir run_mctest --comp=${comp} --suffix=${{ matrix.cogen }}_CHANGES_${comp}_${{ matrix.method }}_${{ matrix.CC || 'default' }}_${{ matrix.mpi }} $PERMISSIVE --verbose --uid=${RUNNER_TRACKING_ID} || { echo "${MCTEST_EXECUTABLE} failed with exit code $?"; exit 1; }
                 else
                   echo No matching tests found
                 fi
               done
           fi

           cd src
           export RUNALL="NO"
           export CHANGEDINSTR=`git diff --name-only $DIFFBASE HEAD | grep \.instr\$ | grep mcstas-comps | xargs -n1 basename | sed s/\.instr//g | sort | uniq | xargs echo | sed s/\ /,/g`
           export NUMCHANGEDINSTR=`git diff --name-only $DIFFBASE HEAD | grep \.instr\$ | grep mcstas-comps | wc -l | xargs echo`
           echo ----
           echo $NUMCHANGEDCOMPS components and $NUMCHANGEDINSTR instruments were changed, resulting in this list:
           echo $CHANGEDINSTR
           echo ----
           cd -
           if [ "$NUMCHANGEDINSTR" -gt "20" ];
           then
             export RUNALL="YES"
           fi
           if [ "$NUMCHANGEDINSTR" != "0" ];
           then
             if [ "$RUNALL" == "NO" ];
             then
               export SCOPE="--instr=$CHANGEDINSTR"
             else
               export SCOPE=" "
             fi
             mkdir -p run_mctest && cd run_mctest
             ${MCTEST_EXECUTABLE}  --mpi=${{ matrix.nmpi }} --testdir $PWD $SCOPE --suffix=CHANGES_${{ matrix.cogen }}_${{ matrix.method }}_${{ matrix.CC || 'default' }}_${{ matrix.mpi }} $PERMISSIVE --verbose --uid=${RUNNER_TRACKING_ID} || { echo "${MCTEST_EXECUTABLE} failed with exit code $?"; exit 1; }
             ${MCVIEWTEST_EXECUTABLE} --nobrowse $PWD
           fi

    - name: 'Tar output files'
      id: tar-package
      if: always()
      run: |
           set -e
           set -u
           set -x
           # Clear out binaries from sim dir and tar up artifact
           ls | grep run_ | xargs -n1 ./src/devel/bin/mccode-simdir-cleanfiles -d 
           tar cvfz mcstas-${{ matrix.os }}.${{ matrix.CC }}.${{ matrix.mpi }}.python-${{ matrix.python }}_output.tgz run_*

    - name: 'Upload Artifact'
      id: tar-upload
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: mcstas-artefacts-${{ matrix.cogen }}.${{ matrix.os }}.${{ matrix.CC }}.${{ matrix.mpi }}.python-${{ matrix.python }}
        path: "mcstas-${{ matrix.cogen }}.${{ matrix.os }}.${{ matrix.CC }}.${{ matrix.mpi }}.python-${{ matrix.python }}_output.tgz"

    - name: Setup tmate session for manual debugging
      uses: mxschmitt/action-tmate@v3
      if: always() && (inputs.manual-debugging == true)
      with:
        limit-access-to-actor: true

  compare:
    name: mcstas-basictest-comparison
    needs: build
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        path: src

    - name: Get conda dependency list
      id: conda-deps
      run: |
           ./src/devel/bin/mccode-create-conda-yml -m mcstas -n mcstas -o dependencies.yml

    - uses: mamba-org/setup-micromamba@v3
      with:
        environment-name: mcstas
        environment-file: dependencies.yml

    - name: Configure build and install mcstas
      id: mcstas-install
      run: |
           # Only the Python tooling (mcviewtest, mcplotdiff-html, mcplot-html) is
           # actually needed here - the diff/report generation is platform-agnostic
           # regardless of which OS originally produced the monitor data - but we
           # reuse the exact same install path as the build job for consistency,
           # rather than maintaining a second, lighter-weight install mechanism.
           ./src/devel/bin/mccode-build-conda -m mcstas -s $PWD/src -b $PWD/build_mcstas

    - name: 'Download all platform test artifacts'
      id: download
      uses: actions/download-artifact@v6
      with:
        pattern: mcstas-artefacts-*
        path: downloaded_artifacts

    - name: 'Merge changed-instrument columns into one shared testdir'
      id: merge
      # Plain (non-login) shell here deliberately: this step is pure
      # tar/mv/mkdir, no conda activation needed, and a login shell's
      # ~/.bash_logout (standard on Debian/Ubuntu images) runs
      # `clear_console -q` on exit, which can fail in a non-interactive
      # runner and override our own explicit `exit 0`/`exit 1` below,
      # making a successful "nothing changed" run report as a failure.
      shell: bash {0}
      run: |
           set -e
           set -u
           set -x

           mkdir basictests

           REFLABEL=""
           FOUND_ANY="0"

           for tgz in downloaded_artifacts/*/*.tgz; do
             work=$(mktemp -d)
             tar xzf "$tgz" -C "$work"
             FOUND_ANY="1"
             artifact_name=$(basename "$(dirname "$tgz")")

             if [ -d "$work"/run_mctest/ ]; then
               mkdir -p changes
               for labeldir in "$work"/run_mctest/*/; do
                 if [[ "$artifact_name" == *"ubuntu-latest"* ]]; then
                   REFLABEL=$(basename "$labeldir")
                 fi
                 mv $labeldir changes/
               done
             fi

             for labeldir in "$work"/run_basictests/*/; do
               mv $labeldir basictests/
             done
             rm -rf "$work"
           done

           echo "FOUND_ANY=$FOUND_ANY" >> "$GITHUB_ENV"
           if [ "$FOUND_ANY" == "0" ]; then
             echo "No instrument/component changes detected on any platform"
           fi

           if [ -z "$REFLABEL" ]; then
             echo "WARNING: could not identify the ubuntu-latest/conda reference column"
           else
             echo "REFLABEL=$REFLABEL" >> "$GITHUB_ENV"
             echo "Reference column: $REFLABEL"
           fi

    - name: 'Run mcviewtest across all platform columns'
      id: viewtest
      run: |
           set -e
           set -u
           set -x
           if [ -d changes/ ]; then
             cd changes
             if [ -z "$REFLABEL" ]; then
               mcviewtest --reflabel "$REFLABEL" --nobrowse
             else
               mcviewtest --nobrowse
             fi
             cd -
           fi
           if [ -d basictests/ ]; then
             cd basictests && mcviewtest --nobrowse && ls -l $PWD && cd -
           fi

    - name: 'Tar output (all platform folders + comparison tables)'
      id: tar-package
      run: |
           if [ -d changes/ ]; then
             tar cvfz mcstas-basictest-comparison.tgz changes basictests
           else
             tar cvfz mcstas-basictest-comparison.tgz basictests
           fi

    - name: 'Upload comparison artifact'
      id: comparison-upload
      uses: actions/upload-artifact@v6
      with:
        name: mcstas-basictest-comparison
        path: mcstas-basictest-comparison.tgz

    - name: Setup tmate session for manual debugging
      uses: mxschmitt/action-tmate@v3
      if: always() && (inputs.manual-debugging == true)
      with:
        limit-access-to-actor: true
