name: mcxtrace-conda-testsuite
on:
  schedule:
    - cron: '15 03 * * *'  # 03:15 every day

  workflow_dispatch:
    inputs:
      manual-debugging:
        type: boolean
        description: Launch manual debugging tmate for inspection (automatic in case of errors)
        default: false
      comparison:
        type: boolean
        description: Run mxviewtest comparison tables across all platforms
        default: false

# The mxviewtest comparison is off by default (schedule); request it via the
# "comparison" tickbox when running the workflow manually
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, mpi: 'openmpi', nmpi: 'auto', cogen: 'classic', method: 'conda' }
          - { os: ubuntu-latest, mpi: 'openmpi', nmpi: 'auto', cogen: 'antlr', method: 'conda' }
          - { os: macos-latest, mpi: 'openmpi', nmpi: '2', cogen: 'classic', method: 'conda' }
          - { os: windows-latest, mpi: 'msmpi', nmpi: 'auto', cogen: 'classic', method: 'conda' }
          # mccode.org-style .deb packages from buildscripts/build_debs_mcxtrace, installed
          # in /usr with no $MCXTRACE set (as for users of the mccode.org apt repo)
          - { os: ubuntu-24.04, mpi: 'openmpi', nmpi: 'auto', cogen: 'classic', method: 'debian' }

    name: ${{ matrix.os }}.${{ matrix.mpi }}.${{ matrix.cogen }}${{ matrix.method == 'debian' && '.debian' || '' }}.conda-testsuite
    runs-on: ${{ matrix.os }}
    env:
      # Compile instruments in parallel, except with mccode-antlr (shared cogen cache)
      MCTEST_JOBS: ${{ matrix.cogen != 'antlr' && '-j auto' || '' }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        path: src

    - name: Setup VS in shell Intel
      if: runner.os == 'Windows'
      uses: egor-tensin/vs-shell@v2

    - name: Get conda dependency list
      id: conda-deps
      if: matrix.method == 'conda'
      run: |
           ./src/devel/bin/mccode-create-conda-yml -m mcxtrace -n mcxtrace -o dependencies.yml
           cat dependencies.yml

    - uses: mamba-org/setup-micromamba@v3
      if: matrix.method == 'conda'
      with:
        environment-file: dependencies.yml 
        environment-name: mcxtrace

    - name: Check versions and set worker label
      id: version-checks
      run: |
           which python3
           python3 --version
           which cmake
           cmake --version
           MYWORKERID=`echo ${RUNNER_TRACKING_ID} | md5sum |  cut -c1-12`
           echo MYWORKERID=${MYWORKERID} >> "$GITHUB_ENV"

    - name: Configure build and install mcxtrace
      id: mcxtrace-install
      if: matrix.method == 'conda'
      run: |
           ./src/devel/bin/mccode-build-conda -m mcxtrace -s $PWD/src -b $PWD/build_mcxtrace

    # Azure-hosted Ubuntu mirror reported slow; use the main archive for apt.
    # Unverified: compare run times before keeping.
    - name: Bypass slow Azure Ubuntu mirror
      if: matrix.method == 'debian'
      run: |
           sudo grep -rl 'azure.archive.ubuntu.com' \
             /etc/apt/sources.list /etc/apt/sources.list.d \
             --include='*.list' --include='*.sources' 2>/dev/null |
             xargs -r sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g'

    - name: Build and install mccode.org-style .deb packages (debian)
      id: mcxtrace-install-debian
      if: matrix.method == 'debian'
      run: |
           set -e
           set -u
           set -x
           # McCode apt repo (https://mccode-dev.github.io/debian/), as for users: provides mcpl, ncrystal and cif2hkl (>= 1.5.1)
           sudo curl -fsSLo /usr/share/keyrings/mccode-apt.gpg https://mccode-dev.github.io/debian/mccode-apt.gpg
           sudo curl -fsSLo /etc/apt/sources.list.d/mccode.sources https://mccode-dev.github.io/debian/mccode.sources
           sudo apt-get update
           # Build dependencies, as in dependency-scripts/getdeps_debian (minus LaTeX/equivs:
           # the manuals package and the suite metapackage are not needed for testing)
           sudo apt-get -y install git cmake gcc g++ gfortran flex bison build-essential rsync libopenmpi-dev openmpi-bin
           cd src
           ./buildscripts/build_debs_mcxtrace 3.99.99
           ls -l dist
           # Install everything that was built, except the manuals package. apt resolves the
           # runtime dependencies declared by the packages themselves (python3-*, libxrl-dev, ...)
           sudo apt-get -y install $(ls $PWD/dist/*.deb | grep -v -- '-manuals')
           # Same openmpi transport settings as in the basictest source builds
           sudo sed -i.bak 's/"mpirun/"mpirun --mca btl self,vader,tcp/g' /usr/share/mcxtrace/tools/Python/mccodelib/mccode_config.json
           test -x /usr/bin/mcxtrace
           test -x /usr/bin/mxtest
           test -d /usr/share/mcxtrace/resources/data

    - name: Setup mcxtrace-antlr
      id: setup-mcxtrace-antlr
      if: matrix.cogen == 'antlr'
      run: |
        # Cache checkout src/ with mccode-antlr
        if [ "${{ matrix.cogen }}" == "antlr" ];
        then
          # Use mccode-antlr from git main instead of the conda-forge release
          python3 -m pip install --force-reinstall --no-deps git+https://github.com/mccode-dev/mccode-antlr
          # Set up config file to use mcxtrace-antlr
          MCCODE_CONFIG=`mxrun --write-user-config | cut -f4 -d\ `
          sed -i.bak s+\"MCCOGEN\"\:\ \"mcxtrace\",+\"MCCOGEN\"\:\ \"mcxtrace-antlr\ -I\$\{CONDA_PREFIX\}/share/mcxtrace/resources\",+g ${MCCODE_CONFIG}
          grep -H COGEN ${MCCODE_CONFIG}
          MCCODEANTLR_FLAGS__NEXUS=`grep NEXUSFLAGS ${MCCODE_CONFIG} |cut -f4 -d\"`
          echo "MCCODEANTLR_FLAGS__NEXUS=${MCCODEANTLR_FLAGS__NEXUS}" >> "$GITHUB_ENV"
          # Pre-populate mccode-antlr cache from registries minted from this checkout (mccode-antlr#118)
          mccode-antlr cache register src common/lib/share mccode/nlib/share mccode/xlib/share -o regs/libc-registry.txt
          mccode-antlr cache register src mcxtrace-comps -o regs/mcxtrace-registry.txt
          mccode-antlr cache populate --from-path src --flavor mcxtrace --registry-dir regs
        fi

    - name: Validate build output
      id: build-validation
      if: always() && matrix.method == 'conda'
      run: |
           set -e
           set -u
           set -x
           if [ "$RUNNER_OS" == "Windows" ];
           then
             echo "Validating Windows build output..."
             echo "CONDA_PREFIX: $CONDA_PREFIX"
             echo "Checking for mcxtrace executable..."
             test -f ${CONDA_PREFIX}/bin/mcxtrace || test -f ${CONDA_PREFIX}/bin/mcxtrace.bat || { echo "ERROR: mcxtrace not found"; exit 1; }
             echo "Checking for mxtest executable..."
             test -f ${CONDA_PREFIX}/bin/mxtest.bat || { echo "ERROR: mxtest.bat not found"; ls -la ${CONDA_PREFIX}/bin/ | grep -i mxtest || echo "No mxtest found"; exit 1; }
           else
             echo "Validating Unix build output..."
             test -f ${CONDA_PREFIX}/bin/mcxtrace || { echo "ERROR: mcxtrace not found"; exit 1; }
             test -f ${CONDA_PREFIX}/bin/mxtest || { echo "ERROR: mxtest not found"; exit 1; }
           fi

    - name: Post install openmpi hacks macOS
      id: post-install-openmpi-hacks-macOS
      if: runner.os == 'macOS' 
      run: |
             if [ "${{ matrix.mpi }}" == "openmpi" ]; then
               sed -i.bak 's+mpirun+mpirun\ -mca\ regx\ naive\ --verbose\ --mca\ btl_tcp_if_include\ lo0+g' ${CONDA_PREFIX}/share/mcxtrace/tools/Python/mccodelib/mccode_config.json
             fi

    - name: Test suite, up to 2-core MPI
      id: test-suite
      run: |
           # Create and cd to directory for test output data
           mkdir run_test-suite && cd run_test-suite
           # Test script name
           export MXTEST_EXECUTABLE="mxtest"
           if [ "$RUNNER_OS" == "Windows" ];
           then
             export MXTEST_EXECUTABLE="mxtest.bat"
           fi
           # Workaround for warning about "too long" tmpdir name on macOS/openmpi
           if [ "$RUNNER_OS" == "macOS" ];
           then
             mkdir ${HOME}/tmp
             export TMPDIR=${HOME}/tmp
           fi
           if [ "${{ matrix.method }}" == "debian" ];
           then
             # Use the system python3 the .deb tools are installed for, and make
             # sure the resource dir is NOT given via the environment
             export PATH=/usr/bin:$PATH
             unset MCXTRACE
             test "$(command -v mxtest)" == "/usr/bin/mxtest"
           fi
           # Run the test with 2 core mpi
           ${MXTEST_EXECUTABLE} --verbose ${MCTEST_JOBS} --nsigma 5 --nohtml --testdir $PWD --suffix ${{ matrix.cogen }}_${{ matrix.os }}_${{ matrix.mpi }}${{ matrix.method == 'debian' && '_debian' || '' }} --mpi=${{ matrix.nmpi }} --uid=${MYWORKERID}

    - name: 'Tar output files'
      id: tar-package
      if: always()
      run: |
           set -e
           set -u
           set -x
           # Clear out binaries from sim dir and tar up artifact
           ls | grep run_ | xargs -n1 ./src/devel/bin/mccode-simdir-cleanfiles -d 
           # Nothing reads MCPL output, drop it
           find run_test-suite \( -name '*.mcpl' -o -name '*.mcpl.gz' \) -delete
           tar cvfz mcxtrace-${{ matrix.cogen }}.${{ matrix.os }}.${{ matrix.mpi }}${{ matrix.method == 'debian' && '.debian' || '' }}.conda-testsuite_output.tgz run_test-suite

    - name: 'Upload Artifact'
      id: tar-upload
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: mcxtrace-artefacts-${{ matrix.os }}.${{ matrix.cogen }}.${{ matrix.mpi }}${{ matrix.method == 'debian' && '.debian' || '' }}.conda-testsuite
        path: "mcxtrace-${{ matrix.cogen }}.${{ matrix.os }}.${{ matrix.mpi }}${{ matrix.method == 'debian' && '.debian' || '' }}.conda-testsuite_output.tgz"

    - name: 'Tar logs of failed tests'
      id: tar-failedlogs
      if: always()
      run: |
           set -e
           set -u
           set -x
           # Logs from instrument folders with a compile error (<Instr>.failed)
           # or a runtime error / value off (mctest "failed" flag in the test json)
           { find run_* -name '*.failed' 2>/dev/null || true
             grep -rl --include='*.json' --exclude='testresults_*' '"failed": true' run_* 2>/dev/null || true
           } | sed 's#/[^/]*$##' | sort -u | while read -r d; do
             find "$d" -maxdepth 1 -type f \( -name '*.txt' -o -name '*.failed' -o -name '*.json' \)
           done > failed_logs.txt
           if [ -s failed_logs.txt ]; then tar cvfz mcxtrace-${{ matrix.os }}.${{ matrix.cogen }}.${{ matrix.mpi }}${{ matrix.method == 'debian' && '.debian' || '' }}.conda-testsuite_failedlogs.tgz -T failed_logs.txt; fi

    - name: 'Upload failed-test logs'
      id: failedlogs-upload
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: mcxtrace-failedlogs-${{ matrix.os }}.${{ matrix.cogen }}.${{ matrix.mpi }}${{ matrix.method == 'debian' && '.debian' || '' }}.conda-testsuite
        path: "mcxtrace-${{ matrix.os }}.${{ matrix.cogen }}.${{ matrix.mpi }}${{ matrix.method == 'debian' && '.debian' || '' }}.conda-testsuite_failedlogs.tgz"
        if-no-files-found: ignore

    - name: Setup tmate session for manual debugging
      uses: mxschmitt/action-tmate@v3
      if: always() && (inputs.manual-debugging == true)
      with:
        limit-access-to-actor: true

  compare:
    name: mcxtrace-conda-testsuite-comparison
    needs: build
    # Nightly (schedule), or when requested (manual runs with the "comparison" tickbox)
    if: always() && (inputs.comparison || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Free disk space for the merged platform outputs
      run: |
           sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
           df -h .

    - name: Checkout
      uses: actions/checkout@v6
      with:
        path: src

    - name: Get conda dependency list
      id: conda-deps
      run: |
           ./src/devel/bin/mccode-create-conda-yml -m mcxtrace -n mcxtrace -o dependencies.yml

    - uses: mamba-org/setup-micromamba@v3
      with:
        environment-name: mcxtrace
        environment-file: dependencies.yml


    - name: Configure build and install mcxtrace
      id: mcxtrace-install
      run: |
           # Only the Python tooling (mxviewtest, mxplotdiff-html, mxplot-html) is
           # actually needed here - the diff/report generation is platform-agnostic
           # regardless of which OS originally produced the monitor data - but we
           # reuse the exact same install path as the build job for consistency,
           # rather than maintaining a second, lighter-weight install mechanism.
           ./src/devel/bin/mccode-build-conda -m mcxtrace -s $PWD/src -b $PWD/build_mcxtrace

    - name: 'Download all platform test artifacts'
      id: download
      uses: actions/download-artifact@v6
      with:
        # matches mcxtrace-artefacts-ubuntu-latest.openmpi.conda-testsuite,
        # mcxtrace-artefacts-macos-latest.openmpi.conda-testsuite,
        # mcxtrace-artefacts-windows-latest.msmpi.conda-testsuite - by pattern
        # rather than hardcoded names, so this keeps working if the build
        # matrix gains/loses a platform
        pattern: mcxtrace-artefacts-*.conda-testsuite
        path: downloaded_artifacts

    - name: 'Merge platform columns into one shared testdir'
      id: merge
      run: |
           set -e
           set -u
           set -x

           mkdir mcxtrace-nightly
           REFLABEL=""

           # Each platform's tarball contains exactly one label directory
           # directly under run_test-suite/ (e.g.
           # mcxtrace-1.99.99_mpi_x_2_ubuntu-latest_openmpi_<ncount>_Linux_<datetime>).
           # mxviewtest treats each such directory as one comparison "column",
           # so merging them as siblings under one shared testdir is all that's
           # needed to make them comparable.
           for tgz in downloaded_artifacts/*/*.tgz; do
             work=$(mktemp -d)
             tar xzf "$tgz" -C "$work" --exclude='*.c'
             artifact_name=$(basename "$(dirname "$tgz")")

             for labeldir in "$work"/run_test-suite/*/; do
               if [[ "$artifact_name" == *"ubuntu-latest.classic"* ]]; then
               REFLABEL=$(basename "$labeldir")
             fi
               mv $labeldir mcxtrace-nightly/
               done
             done
             rm -rf "$work"

           if [ -z "$REFLABEL" ]; then
             echo "WARNING: could not identify the ubuntu-latest/conda reference column"
           else
           echo "REFLABEL=$REFLABEL" >> "$GITHUB_ENV"
           echo "Reference column: $REFLABEL"
           fi

    - name: 'Run mxviewtest across all platform columns'
      id: viewtest
      run: |
           cd "$PWD/mcxtrace-nightly"
           if [ -n "${REFLABEL:-}" ]; then
             mxviewtest --reflabel "$REFLABEL" --nobrowse --nodiff
           else
             mxviewtest --nobrowse --nodiff
           fi

    - name: 'Tar mcxtrace-nightly output (all platform folders + comparison table)'
      id: tar-package
      # Full merged data only for manual comparison runs; nightlies keep it in the platform artifacts
      if: always() && github.event_name != 'schedule'
      run: |
           tar cvfz mcxtrace-conda-testsuite-comparison.tgz mcxtrace-nightly

    - name: 'Upload comparison artifact'
      id: comparison-upload
      uses: actions/upload-artifact@v6
      # Full merged data only for manual comparison runs; nightlies keep it in the platform artifacts
      if: always() && github.event_name != 'schedule'
      with:
        name: mcxtrace-testsuite-comparison
        path: mcxtrace-conda-testsuite-comparison.tgz

    - name: 'Raw data per instrument as release assets in mcxtrace-nightly'
      id: release
      if: always() && steps.viewtest.outcome == 'success' && github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ secrets.NIGHTLY_TOKEN }}
      run: |
           set -euo pipefail
           day=$(date -u +%F)
           echo "NIGHT=$day" >> "$GITHUB_ENV"
           repo=mccode-dev/mcxtrace-nightly
           cd mcxtrace-nightly
           for col in */; do
             col=${col%/}
             [ "$col" = _lib ] && continue
             # same platform key as tools/nightly-site/summarize.py column_key()
             key=$(echo "$col" | cut -d_ -f2- | rev | cut -d_ -f2- | rev)
             mkdir ../rel
             for instr in "$col"/*/; do
               tar czf "../rel/$(basename "$instr").tgz" "${instr%/}"
             done
             gh release create "${day}_${key}" -R $repo --title "${day} ${key}" \
               --notes "Raw output of $col from https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" ../rel/*.tgz
             rm -rf ../rel
           done
           # ponytail: fixed 14-night retention of the raw data, tune if release storage matters
           gh release list -R $repo --limit 1000 --json tagName,createdAt \
             -q ".[] | select(.createdAt < \"$(date -u -d '14 days ago' +%FT%TZ)\") | .tagName" |
             xargs -r -n1 gh release delete -R $repo --yes --cleanup-tag

    - name: 'Strip data files, keeping what the nightly site shows'
      id: site
      if: always() && steps.viewtest.outcome == 'success'
      run: |
           set -euo pipefail
           du -sh mcxtrace-nightly
           # mcviewtest is done with the .dat/.h5/list-mode data: keep html, plots, test json and logs
           find mcxtrace-nightly -type f ! \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.txt' -o -name '*.pdf' -o -name '*.png' -o -name '*.svg' -o -name '*.instr' -o -name '*.sim' -o -name '*.failed' \) -delete
           du -sh mcxtrace-nightly
           tar czf mcxtrace-nightly-site.tgz mcxtrace-nightly
           ls -l mcxtrace-nightly-site.tgz

    - name: 'Upload nightly site artifact'
      id: site-upload
      uses: actions/upload-artifact@v6
      if: always() && steps.site.outcome == 'success'
      with:
        name: mcxtrace-nightly-site
        path: mcxtrace-nightly-site.tgz

    - name: 'Trigger the mcxtrace-nightly site deploy'
      if: always() && steps.site-upload.outcome == 'success' && github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ secrets.NIGHTLY_TOKEN }}
      run: |
           gh api repos/mccode-dev/mcxtrace-nightly/dispatches -f event_type=nightly \
             -f 'client_payload[flavor]=mcxtrace' -f 'client_payload[run_id]=${{ github.run_id }}' \
             -f "client_payload[date]=${NIGHT:-$(date -u +%F)}"

    - name: Setup tmate session for manual debugging
      uses: mxschmitt/action-tmate@v3
      if: always() && (inputs.manual-debugging == true)
      with:
        limit-access-to-actor: true
